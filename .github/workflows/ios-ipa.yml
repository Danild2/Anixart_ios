name: Build and verify iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', README.md, tools/probe_api.py, tools/LiveContractCheck.swift, .github/workflows/api-contracts.yml]
  pull_request:
permissions:
  contents: read
concurrency:
  group: iphone-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify tools and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Artifacts
          xcodebuild -version | tee Artifacts/toolchain.log
          xcodebuild -showsdks | tee -a Artifacts/toolchain.log
          python3 tools/check_source.py
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          brew install xcodegen
          xcodegen --version | tee -a Artifacts/toolchain.log
          xcodegen generate
      - name: Prepare VLC verification runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install --cask vlc
          python3 -m venv .build/vlc-check
          .build/vlc-check/bin/pip --quiet install python-vlc==3.0.21203
          .build/vlc-check/bin/python - <<'PY'
          import vlc
          instance = vlc.Instance('--intf=dummy', '--vout=dummy', '--aout=dummy', '--quiet')
          assert instance is not None, 'VLC runtime did not initialize'
          print('VLC verification runtime:', vlc.libvlc_get_version().decode())
          instance.release()
          PY
      - name: Static analysis
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project AnixartPort.xcodeproj -scheme AnixartPort \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/analyze CODE_SIGNING_ALLOWED=NO analyze \
            2>&1 | tee Artifacts/analyze.log
      - name: Select iPhone 17 simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes -j > Artifacts/runtimes.json
          python3 tools/select_simulator.py
      - name: Unit and UI tests
        id: core
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project AnixartPort.xcodeproj -scheme AnixartPort \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .build/tests -resultBundlePath Artifacts/Tests.xcresult \
            -skip-testing:AnixartPortUITests/NavigationTests/testVLCResolvesRealMediaStream \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee Artifacts/tests.log
      - name: Resolve a real stream through the iOS interface
        id: resolve
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project AnixartPort.xcodeproj -scheme AnixartPort \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath .build/tests -resultBundlePath Artifacts/Streaming.xcresult \
            -only-testing:AnixartPortUITests/NavigationTests/testVLCResolvesRealMediaStream \
            CODE_SIGNING_ALLOWED=NO test-without-building 2>&1 | tee Artifacts/streaming.log
      - name: Export simulator screenshots
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          for suite in Tests Streaming; do
            if test -d "Artifacts/$suite.xcresult"; then
              xcrun xcresulttool export attachments --path "Artifacts/$suite.xcresult" --output-path "Artifacts/Screenshots/$suite"
            fi
          done
      - name: Decode the resolved real stream in VLC
        id: vlc
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          simulator_state=$(xcrun simctl list devices -j | python3 -c 'import json,os,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["state"] for values in devices.values() for d in values if d["udid"] == os.environ["SIMULATOR_ID"]))')
          if test "$simulator_state" != Booted; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          container=$(xcrun simctl get_app_container "$SIMULATOR_ID" local.anixartport.client data)
          capture="$container/Library/Caches/VLCStreamForTest.json"
          test -f "$capture"
          .build/vlc-check/bin/python tools/verify_vlc_stream.py "$capture" Artifacts/vlc-stream-check.json
      - name: Build Release for iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project AnixartPort.xcodeproj -scheme AnixartPort \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath .build/release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build 2>&1 | tee Artifacts/build.log
      - name: Package and verify IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Payload
          ditto .build/release/Build/Products/Release-iphoneos/AnixartPort.app Payload/AnixartPort.app
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' Payload/AnixartPort.app/Info.plist)
          test -x "Payload/AnixartPort.app/$executable"
          file "Payload/AnixartPort.app/$executable" | tee Artifacts/executable.log
          lipo -verify_arch arm64 "Payload/AnixartPort.app/$executable"
          ditto -c -k --keepParent Payload Artifacts/AnixartPort-unsigned.ipa
          python3 tools/verify_ipa.py Artifacts/AnixartPort-unsigned.ipa
          shasum -a 256 Artifacts/AnixartPort-unsigned.ipa > Artifacts/SHA256SUMS
      - name: Record test build validation
        env:
          CORE_RESULT: ${{ steps.core.outcome }}
          STREAM_RESULT: ${{ steps.resolve.outcome }}
          VLC_RESULT: ${{ steps.vlc.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          result = {'commit': os.environ['GITHUB_SHA'], 'core_tests': os.environ['CORE_RESULT'],
                    'real_stream_resolution': os.environ['STREAM_RESULT'], 'vlc_decoding': os.environ['VLC_RESULT'],
                    'physical_iphone_handoff': 'not tested', 'full_port_complete': False}
          pathlib.Path('Artifacts/VALIDATION.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AnixartPort-unsigned-IPA
          path: |
            Artifacts/AnixartPort-unsigned.ipa
            Artifacts/SHA256SUMS
            Artifacts/VALIDATION.json
          if-no-files-found: error
          retention-days: 14
      - name: Require real streaming success
        env:
          STREAM_RESULT: ${{ steps.resolve.outcome }}
          VLC_RESULT: ${{ steps.vlc.outcome }}
        run: test "$STREAM_RESULT" = success && test "$VLC_RESULT" = success
      - name: Upload diagnostics
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: AnixartPort-diagnostics
          path: Artifacts/
          if-no-files-found: warn
          retention-days: 14
