name: Guest API availability (no credentials)
on:
  workflow_dispatch:
  push:
    paths: [tools/probe_api.py, .github/workflows/api-contracts.yml]
permissions:
  contents: read
jobs:
  guest-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect public responses
        run: python3 tools/probe_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-api-report
          path: Artifacts/api-report.json
          if-no-files-found: error
