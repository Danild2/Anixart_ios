name: AnixartPort
options:
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  AnixartPort:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Anixart
        LSApplicationQueriesSchemes: [vlc-x-callback, vlc]
        CFBundleURLTypes:
          - CFBundleURLName: local.anixartport.client.vlc-return
            CFBundleURLSchemes: [anixartport]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInMedia: true
        LSApplicationCategoryType: public.app-category.entertainment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.anixartport.client
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  AnixartPortTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AnixartPort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnixartPortUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: AnixartPort
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AnixartPort:
    build:
      targets:
        AnixartPort: all
    test:
      targets: [AnixartPortTests, AnixartPortUITests]
